[tool.ruff]
target-version = "py313"
line-length = 100
include = [
    "tools/fetcher-cli/cli.py",
    "src/main/resources/plugins/fetchers/IEEEXplore.py",
    "src/main/resources/plugins/fetchers/SemanticScholar.py",
    "src/main/resources/plugins/fetchers/OpenAlex.py",
    "src/main/resources/plugins/fetchers/lib/snowballr.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
python = ".venv"
extra-paths = ["src/main/resources/plugins/fetchers/lib"]

[tool.ty.src]
include = [
    "tools/fetcher-cli/cli.py",
    "src/main/resources/plugins/fetchers/IEEEXplore.py",
    "src/main/resources/plugins/fetchers/SemanticScholar.py",
    "src/main/resources/plugins/fetchers/OpenAlex.py",
    "src/main/resources/plugins/fetchers/lib/snowballr.py",
]
