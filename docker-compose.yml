services:
    # PostgreSQL Database
    db:
        image: postgres:16.1-alpine3.19
        restart: always
        environment:
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - ./db-data:/var/lib/postgresql/data
        healthcheck:
            test: "pg_isready -U postgres"
            start_period: 4s # wait 4s to let db get ready for accepting connections
            start_interval: 2s # start first healthcheck after 2s
        networks:
            - db_network
        profiles: [ "", "db-only", "registry" ]

    # Use local backend
    backend-local:
        build:
            context: .
        environment:
            PORT: ${PORT:-8080}
            LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
            DATABASE_PASSWORD: ${DATABASE_PASSWORD}
            DATABASE_HOST: db # use db service as db host
            JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
            JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
            PLUGIN_DIRECTORY: /app/plugins/
        volumes:
            - ./plugins:/app/plugins
        ports:
            - ${PORT:-8080}:${PORT:-8080}
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            start_period: 4s # wait 4s to let backend get ready for accepting connections
            start_interval: 2s # start first healthcheck after 2s
        networks:
            - db_network
            - grpc_network
        profiles: [ "" ]

    proxy-local:
        build:
            context: .
            dockerfile: Dockerfile.proxy
        ports:
            - "${WEB_PORT:-8081}:${WEB_PORT:-8081}"
        command:
            # Point to the backend service name within the Docker network
            - --backend_addr=backend-local:${PORT:-8080}
            - --allow_all_origins # Crucial for local dev where frontend is on different origin
            - --run_tls_server=false # Don't require TLS
            - --server_http_debug_port=${WEB_PORT:-8081} # Proxy listens on this port inside the container
        depends_on:
            backend-local:
                condition: service_healthy
        networks:
            - grpc_network
        profiles: [ "" ]

    # Use the published backend with the specified tag
    backend-registry:
        image: ghcr.io/se-uulm/snowballr-backend:${BACKEND_TAG:-latest-dev}
        environment:
            PORT: ${PORT:-8080}
            LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
            DATABASE_PASSWORD: ${DATABASE_PASSWORD}
            DATABASE_HOST: db # use db service as db host
            JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
            JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64}
            PLUGIN_DIRECTORY: /app/plugins/
        volumes:
            - ./plugins:/app/plugins
        ports:
            - ${PORT:-8080}:${PORT:-8080}
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            start_period: 4s # wait 4s to let backend get ready for accepting connections
            start_interval: 2s # start first healthcheck after 2s
        networks:
            - db_network
            - grpc_network
        profiles: [ "registry" ]

    proxy-registry:
        build:
            context: .
            dockerfile: Dockerfile.proxy
        ports:
            - "${WEB_PORT:-8081}:${WEB_PORT:-8081}"
        command:
            # Point to the backend service name within the Docker network
            - --backend_addr=backend-registry:${PORT:-8080}
            - --allow_all_origins # Crucial for local dev where frontend is on different origin
            - --run_tls_server=false # Don't require TLS
            - --server_http_debug_port=${WEB_PORT:-8081} # Proxy listens on this port inside the container
        depends_on:
            backend-registry:
                condition: service_healthy
        networks:
            - grpc_network
        profiles: [ "registry" ]

    # Proxy that listens to localhost instead of a service; can be used for local development
    proxy:
        build:
            context: .
            dockerfile: Dockerfile.proxy
        ports:
            - "${WEB_PORT:-8081}:${WEB_PORT:-8081}"
        command:
            # Point to the backend on the machine's host
            - --backend_addr=host.docker.internal:${PORT:-8080}
            - --allow_all_origins # Crucial for local dev where frontend is on different origin
            - --run_tls_server=false # Don't require TLS
            - --server_http_debug_port=${WEB_PORT:-8081} # Proxy listens on this port inside the container
        profiles: [ "proxy-only" ]

networks:
    db_network:
        driver: bridge
    grpc_network:
        driver: bridge
