services:
    db:
        image: postgres:16.1-alpine3.19
        restart: always
        environment:
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - ./db-data:/var/lib/postgresql/data
        networks:
            - db
        healthcheck:
            test: "pg_isready -U postgres"

networks:
    db:
        driver: bridge
