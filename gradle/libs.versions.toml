[versions]
kotlin-version = "2.1.20"
junit-version = "5.11.4"
assertj-version = "3.27.3"
mockk-version = "1.13.16"
detekt-version = "1.23.8"
kotlinx-kover-version = "0.9.1"
kotlinter-version = "5.0.1"

[libraries]
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin-version" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-version" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-version" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-version" }

assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj-version" }

mockk = { module = "io.mockk:mockk", version.ref = "mockk-version" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-version" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt-version" }
kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kotlinx-kover-version" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter-version" }
