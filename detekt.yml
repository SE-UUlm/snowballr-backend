naming:
    active: true
    BooleanPropertyNaming:
        active: true
        allowedPattern: '(^(is|has|are|needs|does))|((Enabled|Allowed)$)'
    ClassNaming:
        active: true
        aliases: [ 'ClassName' ]
        classPattern: '[A-Z][a-zA-Z0-9]*'
    ConstructorParameterNaming:
        active: true
        parameterPattern: '[a-z][A-Za-z0-9]*'
        privateParameterPattern: '[a-z][A-Za-z0-9]*'
        excludeClassPattern: '$^'
    EnumNaming:
        active: true
        aliases: [ 'EnumEntryName' ]
        enumEntryPattern: '[A-Z][_a-zA-Z0-9]*'
    ForbiddenClassName:
        active: false
        forbiddenName: [ ]
    FunctionNameMaxLength:
        active: false
        aliases: [ 'FunctionMaxNameLength' ]
        maximumFunctionNameLength: 30
    FunctionNameMinLength:
        active: false
        aliases: [ 'FunctionMinNameLength' ]
        minimumFunctionNameLength: 3
    FunctionNaming:
        active: true
        aliases: [ 'FunctionName' ]
        excludes: [ '**/test/**' ]
        functionPattern: '[a-z][a-zA-Z0-9]*'
        excludeClassPattern: '$^'
    FunctionParameterNaming:
        active: true
        parameterPattern: '[a-z][A-Za-z0-9]*'
        excludeClassPattern: '$^'
    InvalidPackageDeclaration:
        active: true
        aliases: [ 'PackageDirectoryMismatch' ]
        rootPackage: 'se.uulm.snowballr.backend'
        requireRootInDeclaration: true
    LambdaParameterNaming:
        active: true
        parameterPattern: '[a-z][A-Za-z0-9]*|_'
    MatchingDeclarationName:
        active: true
        mustBeFirst: true
        multiplatformTargets:
            - 'ios'
            - 'android'
            - 'js'
            - 'jvm'
            - 'native'
            - 'iosArm64'
            - 'iosX64'
            - 'macosX64'
            - 'mingwX64'
            - 'linuxX64'
    MemberNameEqualsClassName:
        active: true
        ignoreOverridden: true
        excludes: [ '**/test/**' ]
    NoNameShadowing:
        active: true
    NonBooleanPropertyPrefixedWithIs:
        active: true
    ObjectPropertyNaming:
        active: true
        aliases: [ 'ObjectPropertyName' ]
        constantPattern: '[A-Za-z][_A-Za-z0-9]*'
        propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
        privatePropertyPattern: '(_)?[A-Za-z][_A-Za-z0-9]*'
    PackageNaming:
        active: true
        aliases: [ 'PackageName' ]
        packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'
    TopLevelPropertyNaming:
        active: true
        constantPattern: '[A-Z][_A-Z0-9]*'
        propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
        privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
    VariableMaxLength:
        active: false
        maximumVariableNameLength: 64
    VariableMinLength:
        active: false
        minimumVariableNameLength: 1
    VariableNaming:
        active: true
        aliases: [ 'PropertyName' ]
        variablePattern: '[a-z][A-Za-z0-9]*'
        privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
        excludeClassPattern: '$^'

