config:
    validation: true
    warningsAsErrors: false
    checkExhaustiveness: false
    # when writing own rules with new properties, exclude the property path e.g.: ['my_rule_set', '.*>.*>[my_property]']
    excludes: [ ]

processors:
    active: true
    exclude:
#        - 'KtFileCountProcessor'
#        - 'PackageCountProcessor'
#        - 'ClassCountProcessor'
#        - 'FunctionCountProcessor'
#        - 'PropertyCountProcessor'
#        - 'ProjectCyclomaticComplexityProcessor'
#        - 'ProjectCognitiveComplexityProcessor'
#        - 'ProjectLLOCProcessor'
#        - 'ProjectCLOCProcessor'
#        - 'ProjectLOCProcessor'
#        - 'ProjectSLOCProcessor'

console-reports:
    active: true
    exclude:
#        - 'ProjectStatisticsReport'
#        - 'ComplexityReport'
        - 'NotificationReport'
        - 'IssuesReport'
        - 'FileBasedIssuesReport'
#        - 'LiteIssuesReport'

comments:
    active: true
    AbsentOrWrongFileLicense:
        active: false
        licenseTemplateIsRegex: false
        licenseTemplate: ''
    DeprecatedBlockTag:
        active: false
    DocumentationOverPrivateFunction:
        active: false
    DocumentationOverPrivateProperty:
        active: false
    EndOfSentenceFormat:
        active: true
        endOfSentenceFormat: '([.?!][ \t\n\r\f<])|([.?!:]$)'
    KDocReferencesNonPublicProperty:
        active: true
        excludes: [ '**/test/**' ]
    OutdatedDocumentation:
        active: true
        matchTypeParameters: true
        matchDeclarationsOrder: true
        allowParamOnConstructorProperties: false
    UndocumentedPublicClass:
        active: false
        excludes: [ '**/test/**' ]
        searchInNestedClass: false
        searchInInnerClass: false
        searchInInnerObject: false
        searchInInnerInterface: false
        searchInProtectedClass: false
        ignoreDefaultCompanionObject: false
    UndocumentedPublicFunction:
        active: false
        excludes: [ '**/test/**' ]
        searchProtectedFunction: false
    UndocumentedPublicProperty:
        active: false
        excludes: [ '**/test/**' ]
        searchProtectedProperty: false
        ignoreEnumEntries: false

complexity:
    active: true
    CognitiveComplexMethod:
        active: true
        allowedComplexity: 15
        excludes: [ '**/test/**' ]
    ComplexCondition:
        active: true
        allowedConditions: 3
    ComplexInterface:
        active: true
        allowedDefinitions: 10
        includeStaticDeclarations: false
        includePrivateDeclarations: false
        ignoreOverloaded: false
    CyclomaticComplexMethod:
        active: true
        allowedComplexity: 14
        ignoreSingleWhenExpression: false
        ignoreSimpleWhenEntries: false
        ignoreNestingFunctions: false
        ignoreLocalFunctions: false
        nestingFunctions:
            - 'also'
            - 'apply'
            - 'forEach'
            - 'isNotNull'
            - 'ifNull'
            - 'let'
            - 'run'
            - 'use'
            - 'with'
    LabeledExpression:
        active: true
        ignoredLabels: [ 'query', 'withUser' ]
    LargeClass:
        active: true
        allowedLines: 600
    LongMethod:
        active: true
        allowedLines: 60
    LongParameterList:
        active: true
        allowedFunctionParameters: 5
        allowedConstructorParameters: 6
        ignoreDefaultParameters: false
        ignoreDataClasses: true
        ignoreAnnotatedParameter: [ ]
    MethodOverloading:
        active: true
        allowedOverloads: 6
    NamedArguments:
        active: true
        allowedArguments: 5
        ignoreMethods: [ ]
        ignoreArgumentsMatchingNames: true
    NestedBlockDepth:
        active: true
        allowedDepth: 4
    NestedScopeFunctions:
        active: false
        allowedDepth: 1
        functions:
            - 'kotlin.apply'
            - 'kotlin.run'
            - 'kotlin.with'
            - 'kotlin.let'
            - 'kotlin.also'
    ReplaceSafeCallChainWithRun:
        active: true
    StringLiteralDuplication:
        active: true
        excludes: [ '**/test/**' ]
        allowedDuplications: 2
        ignoreAnnotation: true
        allowedWithLengthLessThan: 5
        ignoreStringsRegex: '$^'
    TooManyFunctions:
        active: true
        excludes: [ '**/test/**' ]
        allowedFunctionsPerFile: 15
        allowedFunctionsPerClass: 15
        allowedFunctionsPerInterface: 15
        allowedFunctionsPerObject: 15
        allowedFunctionsPerEnum: 15
        ignoreDeprecated: false
        ignorePrivate: false
        ignoreInternal: false
        ignoreOverridden: false
        ignoreAnnotatedFunctions: [ ]

coroutines:
    active: true
    CoroutineLaunchedInTestWithoutRunTest:
        active: false
    GlobalCoroutineUsage:
        active: false
    InjectDispatcher:
        active: true
        dispatcherNames:
            - 'IO'
            - 'Default'
            - 'Unconfined'
    RedundantSuspendModifier:
        active: true
    SleepInsteadOfDelay:
        active: true
    SuspendFunInFinallySection:
        active: false
    SuspendFunSwallowedCancellation:
        active: false
    SuspendFunWithCoroutineScopeReceiver:
        active: false
        aliases: [ 'SuspendFunctionOnCoroutineScope' ]
    SuspendFunWithFlowReturnType:
        active: true

empty-blocks:
    active: true
    EmptyCatchBlock:
        active: true
        allowedExceptionNameRegex: '_|(ignore|expected).*'
    EmptyClassBlock:
        active: true
    EmptyDefaultConstructor:
        active: true
    EmptyDoWhileBlock:
        active: true
    EmptyElseBlock:
        active: true
    EmptyFinallyBlock:
        active: true
    EmptyForBlock:
        active: true
    EmptyFunctionBlock:
        active: true
        ignoreOverridden: false
    EmptyIfBlock:
        active: true
    EmptyInitBlock:
        active: true
    EmptyKotlinFile:
        active: true
    EmptySecondaryConstructor:
        active: true
    EmptyTryBlock:
        active: true
    EmptyWhenBlock:
        active: true
    EmptyWhileBlock:
        active: true

exceptions:
    active: true
    ErrorUsageWithThrowable:
        active: false
    ExceptionRaisedInUnexpectedLocation:
        active: true
        methodNames:
            - 'equals'
            - 'finalize'
            - 'hashCode'
            - 'toString'
    InstanceOfCheckForException:
        active: true
        excludes: [ '**/test/**' ]
    NotImplementedDeclaration:
        active: true
    ObjectExtendsThrowable:
        active: true
    PrintStackTrace:
        active: true
    RethrowCaughtException:
        active: true
    ReturnFromFinally:
        active: true
        ignoreLabeled: false
    SwallowedException:
        active: true
        ignoredExceptionTypes:
            - 'InterruptedException'
            - 'MalformedURLException'
            - 'NumberFormatException'
            - 'ParseException'
        allowedExceptionNameRegex: '_|(ignore|expected).*'
    ThrowingExceptionFromFinally:
        active: true
    ThrowingExceptionInMain:
        active: true
    ThrowingExceptionsWithoutMessageOrCause:
        active: true
        excludes: [ '**/test/**' ]
        exceptions:
            - 'ArrayIndexOutOfBoundsException'
            - 'Exception'
            - 'IllegalArgumentException'
            - 'IllegalMonitorStateException'
            - 'IllegalStateException'
            - 'IndexOutOfBoundsException'
            - 'NullPointerException'
            - 'RuntimeException'
            - 'Throwable'
    ThrowingNewInstanceOfSameException:
        active: true
    TooGenericExceptionCaught:
        active: true
        excludes: [ '**/test/**' ]
        exceptionNames:
            - 'ArrayIndexOutOfBoundsException'
            - 'Error'
            - 'Exception'
            - 'IllegalMonitorStateException'
            - 'IndexOutOfBoundsException'
            - 'NullPointerException'
            - 'RuntimeException'
            - 'Throwable'
        allowedExceptionNameRegex: '_|(ignore|expected).*'
    TooGenericExceptionThrown:
        active: true
        exceptionNames:
            - 'Error'
            - 'Exception'
            - 'RuntimeException'
            - 'Throwable'

