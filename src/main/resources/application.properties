spring.application.name=snowballr-backend

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
# The OpenAPI docs and Swagger UI follow the REST API feature flag. It must not be defined in this file, since it would
# override the value set in SnowballRApplication.kt (default properties have the lowest precedence).
springdoc.api-docs.enabled=${snowballr.rest-api.enabled:false}
springdoc.swagger-ui.enabled=${snowballr.rest-api.enabled:false}
