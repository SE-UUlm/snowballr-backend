name: Lint and Publish Wiki

on:
    push:
        branches:
            - main
            - develop
    pull_request:
    workflow_dispatch:

jobs:
    lint-md:
        name: Linting Markdown
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Lint Markdown
              uses: SE-UUlm/snowballr-ci/src/lint-md@v1
              with:
                  markdownlint-config-path: markdownlint.json
                  source-branch: develop
                  ignore-links: "https://snowballr.informatik.uni-ulm.de*,https://snowballr-dev.informatik.uni-ulm.de*,https://deepwiki.com/*,https://stackoverflow.com/*,https://medium.com/*,https://www.npmjs.com/package/@se-uulm/snowballr-api-client,http://localhost*"
                  ignore-paths: "src/,AGENTS.md,CLAUDE.md,api/grpc/docs/"

    publish-wiki:
        name: Publish Wiki
        if: github.ref_name == 'develop' && github.ref_type == 'branch'
        runs-on: ubuntu-latest
        needs: lint-md
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Publish Wiki
              uses: SE-UUlm/snowballr-ci/src/wiki-publish@v1
