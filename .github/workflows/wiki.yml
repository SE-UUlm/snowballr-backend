name: Lint and Publish Wiki

on:
    push:
        branches:
            - main
            - develop
    pull_request:
    workflow_dispatch:

jobs:
    lint-md:
        name: Linting Markdown
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Lint Markdown
              uses: SE-UUlm/snowballr-ci/src/lint-md@v1
              with:
                  markdownlint-config-path: markdownlint.json
                  source-branch: develop
                  ignore-links: "https://stackoverflow.com/questions/6720050/foreign-key-constraints-when-to-use-on-update-and-on-delete/6720458#6720458,https://medium.com/@pererikbergman/repository-design-pattern-e28c0f3e4a30"
                  ignore-paths: "src/"

            - name: Calculate implementation progress (dry run)
              run: node scripts/calc-impl-progress.js update-wiki

    publish-wiki:
        name: Publish Wiki
        if: github.ref_name == 'develop' && github.ref_type == 'branch'
        runs-on: ubuntu-latest
        needs: lint-md
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Calculate implementation progress
              run: node scripts/calc-impl-progress.js update-wiki

            - name: Publish Wiki
              uses: SE-UUlm/snowballr-ci/src/wiki-publish@v1
