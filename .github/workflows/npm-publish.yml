name: NPM Publish

on:
    pull_request:
        branches: ["develop"]
    push:
        branches: ["develop"]
        tags: ["v*.*.*"]

jobs:
    publish:
        # Channels: alpha for PR previews, beta for develop, latest for release tags
        name: Publish ${{ matrix.client }} client (${{ github.ref_type == 'tag' && 'latest' || github.event_name == 'pull_request' && 'alpha' || 'beta' }})
        # We skip publishing when triggered by a Dependabot update
        if: >-
            github.actor != 'dependabot[bot]' && (
              github.event_name == 'pull_request' ||
              github.ref == 'refs/heads/develop' ||
              github.ref_type == 'tag')
        runs-on: ubuntu-latest
        permissions:
            id-token: write # Required for OIDC
            contents: read
        strategy:
            # Each client is published independently, so one failing does not block the other
            fail-fast: false
            matrix:
                client: [rest, grpc]
        env:
            CHANNEL: ${{ github.ref_type == 'tag' && 'latest' || github.event_name == 'pull_request' && 'alpha' || 'beta' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  # PR head branch for previews; empty on push, which checks out the triggering ref
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0
                  fetch-tags: true

            - name: Publish NPM Package
              uses: ./.github/workflows/publish-client
              with:
                  client: ${{ matrix.client }}
                  channel: ${{ env.CHANNEL }}
