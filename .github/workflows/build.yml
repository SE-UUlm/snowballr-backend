name: Build

on:
    push:
        branches: ["develop"]
        tags: ["v*.*.*"]
    pull_request:
    workflow_dispatch:

env:
    java_version: ${{ vars.JAVA_VERSION }}
    java_distribution: ${{ vars.JAVA_DISTRIBUTION }}

jobs:
    build-jar:
        name: Building the application as jar file
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  submodules: "recursive"

            - name: Setup
              uses: ./.github/workflows/setup/
              with:
                  java_version: ${{ env.java_version }}
                  java_distribution: ${{ env.java_distribution }}

            - name: Build the jar file
              run: ./gradlew shadowJar --stacktrace

            - name: Upload jar file
              uses: actions/upload-artifact@v5
              with:
                  name: snowballr-backend-jar
                  path: build/libs/*.jar
                  if-no-files-found: error

    release:
        name: Create a new release
        runs-on: ubuntu-latest
        needs: build-jar
        if: ${{ github.ref_type == 'tag' }}
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Download jar file
              uses: actions/download-artifact@v6
              with:
                  name: snowballr-backend-jar

            - name: Create Release
              uses: docker://antonyurchenko/git-release:v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  args: snowballr-backend-*.jar

    update-main:
        name: Update main branch
        runs-on: ubuntu-latest
        needs: release
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Merge develop -> main
              uses: devmasx/merge-branch@master
              with:
                  type: now
                  target_branch: main
                  github_token: ${{ secrets.GITHUB_TOKEN }}
